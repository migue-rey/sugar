services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hardware_designer
      POSTGRES_USER: designer
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-designer-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U designer -d hardware_designer"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://designer:${DB_PASSWORD:-local-designer-password}@db:5432/hardware_designer
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID:-}
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY:-}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped
  web:
    build: ./web
    ports:
      - "${APP_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
