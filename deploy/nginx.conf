# Query strings, Referer and private share tokens must not enter access logs.
map $uri $sugar_safe_uri {
    ~^/api/shared/ /api/shared/[redacted];
    default $uri;
}
log_format sugar_safe '$remote_addr - [$time_local] "$request_method $sugar_safe_uri $server_protocol" $status $body_bytes_sent';
# Install as /etc/nginx/sites-available/sugar; Certbot adds HTTPS.
server {
    access_log /var/log/nginx/sugar.access.log sugar_safe;
    listen 80;
    listen [::]:80;
    server_name sugar.maykolrey.com;
    client_max_body_size 4m;
    location / {
        proxy_pass http://127.0.0.1:18088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
    }
}
