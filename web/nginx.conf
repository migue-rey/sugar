# Query strings, Referer and private share tokens must not enter access logs.
map $uri $sugar_safe_uri {
    ~^/api/shared/ /api/shared/[redacted];
    default $uri;
}
log_format sugar_safe '$remote_addr - [$time_local] "$request_method $sugar_safe_uri $server_protocol" $status $body_bytes_sent';
server {
    access_log /var/log/nginx/access.log sugar_safe;
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ { proxy_pass http://api:3000; proxy_read_timeout 125s; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location / { try_files $uri $uri/ /index.html; }
}
